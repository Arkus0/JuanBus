name: Surbus Data Check

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Surbus data
        id: verify
        continue-on-error: true
        run: npm run check:surbus-data

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surbus-data-check-report
          path: surbus-data-check-report.md
          if-no-files-found: warn

      - name: Open issue when data changed
        if: steps.verify.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '⚠️ Surbus: revisar actualización de líneas/paradas';
            const body = fs.existsSync('surbus-data-check-report.md')
              ? fs.readFileSync('surbus-data-check-report.md', 'utf8')
              : 'No se pudo generar el informe.';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100
            });

            const existing = openIssues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Nueva ejecución (${new Date().toISOString()}):\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['maintenance', 'data-sync']
              });
            }

      - name: Fail workflow if verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
